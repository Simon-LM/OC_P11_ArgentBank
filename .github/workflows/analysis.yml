# @format

name: 📊 Analysis

permissions:
  contents: read
  pull-requests: write
  issues: write

# Same deduplication as ci-cd.yml: push on "**" plus pull_request meant every
# push to a branch with an open PR fired this workflow twice. Branch work
# reaches CI through its PR; pushes straight to main and develop still run on
# their own.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Supersede a still-running analysis when new commits land on the same PR.
# Runs on main/develop are left to finish: they are the record of what the
# branch actually measured.
concurrency:
  group: analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

jobs:
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 📊 Run tests with coverage
        run: pnpm run test:coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: app/coverage
          files: ./coverage/clover.xml
          fail_ci_if_error: false
          verbose: true

      - name: 💬 Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coveragePath = path.join('app', 'coverage', 'coverage-summary.json');
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              
              const total = coverage.total;
              const coveragePercent = total.lines.pct;
              
              const comment = `## 📊 Coverage Report
              
              | Metric | Coverage |
              |--------|----------|
              | Lines | ${total.lines.pct}% (${total.lines.covered}/${total.lines.total}) |
              | Functions | ${total.functions.pct}% (${total.functions.covered}/${total.functions.total}) |
              | Branches | ${total.branches.pct}% (${total.branches.covered}/${total.branches.total}) |
              | Statements | ${total.statements.pct}% (${total.statements.covered}/${total.statements.total}) |
              
              ${coveragePercent >= 80 ? '✅' : coveragePercent >= 60 ? '⚠️' : '❌'} **Overall Coverage: ${coveragePercent}%**
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Coverage file not found or invalid:', error.message);
            }

  bundle-analysis:
    name: 📦 Bundle Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build project
        run: pnpm run build

      # Rewritten 2026-08-05. The previous version listed `.js`/`.css` at the
      # ROOT of dist/ — Vite emits them into dist/assets/, so the filter
      # matched nothing and every PR was told "Total Bundle Size: 0.00 KB ✅".
      # It had never measured anything, which is why neither the 271KB font
      # nor the 31KB of react-select was ever flagged.
      #
      # What it measures now: everything index.html makes the browser fetch
      # before the page can paint — scripts, modulepreloads, stylesheets, and
      # the preloaded font and hero image. That last part matters: the font
      # lives in dist/fonts/, so anything scoped to dist/assets/ would still
      # have missed the single largest regression this project has had.
      #
      # Sizes are gzipped, because that is what crosses the network. Formats
      # that are already compressed (woff2, webp, avif, png) are counted raw —
      # gzipping them again gains nothing and would understate them.
      - name: 📦 Measure the critical path
        id: bundle
        run: |
          cat > measure-bundle.mjs << 'EOF'
          import fs from 'fs';
          import path from 'path';
          import { gzipSync } from 'zlib';

          // Budget for the critical path, gzipped.
          //
          // Measured at 266 KB when this was written, down from roughly 480 KB
          // before the Nunito subset (-214 KB) and the react-select removal
          // (-29 KB). The ceiling leaves ~9% headroom: enough for ordinary
          // work, tight enough that a library-sized addition fails. Both
          // regressions above would have been caught by it.
          //
          // Raise it only with a reason, the way a Lighthouse threshold is
          // raised — never to make a red build go green.
          const BUDGET_KB = 290;

          const PRECOMPRESSED = /\.(woff2?|webp|avif|png|jpe?g|ico|gif)$/i;
          const dist = 'dist';
          const html = fs.readFileSync(path.join(dist, 'index.html'), 'utf8');

          // Every local asset index.html points at, in any folder.
          const refs = [...new Set(
            [...html.matchAll(/(?:src|href)="(\/[^"]+)"/g)].map((m) => m[1]),
          )].sort();

          let total = 0;
          const rows = [];
          for (const ref of refs) {
            const file = path.join(dist, ref);
            if (!fs.existsSync(file)) continue;
            const buf = fs.readFileSync(file);
            const size = PRECOMPRESSED.test(ref) ? buf.length : gzipSync(buf, { level: 9 }).length;
            total += size;
            rows.push({ ref, kb: size / 1024 });
          }

          if (rows.length === 0) {
            console.error('No asset resolved from index.html — the build layout changed.');
            console.error('This job is worthless if it silently measures nothing, so it fails here.');
            process.exit(1);
          }

          rows.sort((a, b) => b.kb - a.kb);
          const totalKb = total / 1024;
          const over = totalKb > BUDGET_KB;

          // Everything else, for context: lazy chunks are not on the critical
          // path, but a sharp rise still deserves a look.
          const lazy = fs.readdirSync(path.join(dist, 'assets'))
            .filter((f) => /\.(js|css)$/.test(f) && !refs.includes(`/assets/${f}`))
            .map((f) => {
              const buf = fs.readFileSync(path.join(dist, 'assets', f));
              return { f, kb: gzipSync(buf, { level: 9 }).length / 1024 };
            })
            .sort((a, b) => b.kb - a.kb);

          const fmt = (n) => n.toFixed(1);
          let md = `## 📦 Bundle Analysis\n\n`;
          md += `**Critical path: ${fmt(totalKb)} KB gzipped** — budget ${BUDGET_KB} KB ${over ? '❌' : '✅'}\n\n`;
          md += `What the browser downloads before the page can paint.\n\n`;
          md += `| Asset | Gzipped |\n| --- | ---: |\n`;
          for (const r of rows) md += `| \`${r.ref}\` | ${fmt(r.kb)} KB |\n`;
          md += `| **Total** | **${fmt(totalKb)} KB** |\n`;
          if (lazy.length) {
            md += `\n<details><summary>Lazy chunks (not on the critical path)</summary>\n\n`;
            md += `| Chunk | Gzipped |\n| --- | ---: |\n`;
            for (const l of lazy) md += `| \`${l.f}\` | ${fmt(l.kb)} KB |\n`;
            md += `\n</details>\n`;
          }
          if (over) {
            md += `\n⚠️ **${fmt(totalKb - BUDGET_KB)} KB over budget.** Something now ships on every page that did not before — find it in the table above rather than raising the ceiling.\n`;
          }

          fs.writeFileSync('bundle-report.md', md);
          console.log(md);
          if (over) process.exit(1);
          EOF
          node measure-bundle.mjs

      - name: 💬 Comment PR with bundle report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fs.readFileSync('app/bundle-report.md', 'utf8'),
              });
            } catch (error) {
              console.log('No bundle report to post:', error.message);
            }

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Blocking since 2026-08-04. It used to end every command with `|| true`,
      # so the job was green whatever the audit found — and it was finding 81
      # issues, 3 of them critical. The tree is now clean: every advisory with
      # a published fix is pinned through pnpm.overrides in app/package.json,
      # and the single exception is listed, with its reason, in
      # pnpm.auditConfig.ignoreGhsas.
      #
      # The gate is `moderate` and above, not `high`: with nothing left to
      # ignore, a stricter level costs nothing and catches more. `pnpm audit`
      # exits non-zero on its own, so no `|| true` here — that is the point.
      #
      # If this step fails on a new advisory, the fix order is: pin it in
      # overrides (bounded range — see the warning there), or, only if no fix
      # exists, add a documented ignoreGhsas entry. Never lower the level.
      - name: 🔍 Run security audit
        run: |
          echo "## 🔒 Security Audit Report" > security-report.md
          echo "" >> security-report.md

          # Report first, so the artifact exists even when the gate below fails.
          pnpm audit --json > audit.json || true

          # Check if there are vulnerabilities
          if [ -s audit.json ]; then
            echo "### Vulnerabilities Found:" >> security-report.md
            echo "\`\`\`json" >> security-report.md
            head -20 audit.json >> security-report.md
            echo "\`\`\`" >> security-report.md
          else
            echo "✅ No vulnerabilities found!" >> security-report.md
          fi

          # Check for outdated packages
          echo "" >> security-report.md
          echo "### Outdated Packages:" >> security-report.md
          pnpm outdated --long > outdated.txt || true
          if [ -s outdated.txt ]; then
            echo "\`\`\`" >> security-report.md
            head -10 outdated.txt >> security-report.md
            echo "\`\`\`" >> security-report.md
          else
            echo "✅ All packages are up to date!" >> security-report.md
          fi

      - name: 📤 Upload security report
        uses: actions/upload-artifact@v4
        # Runs even when the gate below fails — the report is what tells you
        # which advisory appeared.
        if: always()
        with:
          name: security-report
          path: app/security-report.md

      # The gate itself, deliberately after the report so a failure still
      # leaves an artifact behind.
      - name: 🚨 Fail on moderate+ vulnerabilities
        run: |
          echo "Auditing production and dev dependencies at moderate and above."
          echo "Pins live in app/package.json → pnpm.overrides"
          echo "Accepted exceptions in app/package.json → pnpm.auditConfig.ignoreGhsas"
          pnpm audit --audit-level=moderate

      - name: 💬 Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            try {
              const report = fs.readFileSync('app/security-report.md', 'utf8');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.log('Security report not found:', error.message);
            }
