# @format

name: 📊 Analysis

permissions:
  contents: read
  pull-requests: write
  issues: write

# Same deduplication as ci-cd.yml: push on "**" plus pull_request meant every
# push to a branch with an open PR fired this workflow twice. Branch work
# reaches CI through its PR; pushes straight to main and develop still run on
# their own.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Supersede a still-running analysis when new commits land on the same PR.
# Runs on main/develop are left to finish: they are the record of what the
# branch actually measured.
concurrency:
  group: analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

jobs:
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 📊 Run tests with coverage
        run: pnpm run test:coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: app/coverage
          files: ./coverage/clover.xml
          fail_ci_if_error: false
          verbose: true

      - name: 💬 Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coveragePath = path.join('app', 'coverage', 'coverage-summary.json');
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              
              const total = coverage.total;
              const coveragePercent = total.lines.pct;
              
              const comment = `## 📊 Coverage Report
              
              | Metric | Coverage |
              |--------|----------|
              | Lines | ${total.lines.pct}% (${total.lines.covered}/${total.lines.total}) |
              | Functions | ${total.functions.pct}% (${total.functions.covered}/${total.functions.total}) |
              | Branches | ${total.branches.pct}% (${total.branches.covered}/${total.branches.total}) |
              | Statements | ${total.statements.pct}% (${total.statements.covered}/${total.statements.total}) |
              
              ${coveragePercent >= 80 ? '✅' : coveragePercent >= 60 ? '⚠️' : '❌'} **Overall Coverage: ${coveragePercent}%**
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Coverage file not found or invalid:', error.message);
            }

  bundle-analysis:
    name: 📦 Bundle Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build project
        run: pnpm run build

      - name: 📦 Analyze bundle size
        run: pnpm run build:analyze
        continue-on-error: true

      - name: 📊 Bundle size report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const distPath = path.join('app', 'dist');
              const statsPath = path.join(distPath, 'stats.json');
              
              // Calculate total bundle size
              let totalSize = 0;
              const files = fs.readdirSync(distPath, { withFileTypes: true });
              
              const bundleInfo = files
                .filter(file => file.isFile() && (file.name.endsWith('.js') || file.name.endsWith('.css')))
                .map(file => {
                  const filePath = path.join(distPath, file.name);
                  const stats = fs.statSync(filePath);
                  totalSize += stats.size;
                  return {
                    name: file.name,
                    size: (stats.size / 1024).toFixed(2) + ' KB'
                  };
                });
              
              const totalSizeKB = (totalSize / 1024).toFixed(2);
              const isLarge = totalSize > 1024 * 1024; // > 1MB
              
              const comment = `## 📦 Bundle Analysis
              
              **Total Bundle Size: ${totalSizeKB} KB** ${isLarge ? '⚠️ Large bundle detected' : '✅'}
              
              ### Main Files:
              ${bundleInfo.map(file => `- **${file.name}**: ${file.size}`).join('\n')}
              
              ${isLarge ? '\n⚠️ Consider code splitting or lazy loading for better performance.' : ''}
              `;
              
              if (context.payload.pull_request) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
              
              console.log(comment);
            } catch (error) {
              console.log('Bundle analysis failed:', error.message);
            }

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Blocking since 2026-08-04. It used to end every command with `|| true`,
      # so the job was green whatever the audit found — and it was finding 81
      # issues, 3 of them critical. The tree is now clean: every advisory with
      # a published fix is pinned through pnpm.overrides in app/package.json,
      # and the single exception is listed, with its reason, in
      # pnpm.auditConfig.ignoreGhsas.
      #
      # The gate is `moderate` and above, not `high`: with nothing left to
      # ignore, a stricter level costs nothing and catches more. `pnpm audit`
      # exits non-zero on its own, so no `|| true` here — that is the point.
      #
      # If this step fails on a new advisory, the fix order is: pin it in
      # overrides (bounded range — see the warning there), or, only if no fix
      # exists, add a documented ignoreGhsas entry. Never lower the level.
      - name: 🔍 Run security audit
        run: |
          echo "## 🔒 Security Audit Report" > security-report.md
          echo "" >> security-report.md

          # Report first, so the artifact exists even when the gate below fails.
          pnpm audit --json > audit.json || true

          # Check if there are vulnerabilities
          if [ -s audit.json ]; then
            echo "### Vulnerabilities Found:" >> security-report.md
            echo "\`\`\`json" >> security-report.md
            head -20 audit.json >> security-report.md
            echo "\`\`\`" >> security-report.md
          else
            echo "✅ No vulnerabilities found!" >> security-report.md
          fi

          # Check for outdated packages
          echo "" >> security-report.md
          echo "### Outdated Packages:" >> security-report.md
          pnpm outdated --long > outdated.txt || true
          if [ -s outdated.txt ]; then
            echo "\`\`\`" >> security-report.md
            head -10 outdated.txt >> security-report.md
            echo "\`\`\`" >> security-report.md
          else
            echo "✅ All packages are up to date!" >> security-report.md
          fi

      - name: 📤 Upload security report
        uses: actions/upload-artifact@v4
        # Runs even when the gate below fails — the report is what tells you
        # which advisory appeared.
        if: always()
        with:
          name: security-report
          path: app/security-report.md

      # The gate itself, deliberately after the report so a failure still
      # leaves an artifact behind.
      - name: 🚨 Fail on moderate+ vulnerabilities
        run: |
          echo "Auditing production and dev dependencies at moderate and above."
          echo "Pins live in app/package.json → pnpm.overrides"
          echo "Accepted exceptions in app/package.json → pnpm.auditConfig.ignoreGhsas"
          pnpm audit --audit-level=moderate

      - name: 💬 Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            try {
              const report = fs.readFileSync('app/security-report.md', 'utf8');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.log('Security report not found:', error.message);
            }
